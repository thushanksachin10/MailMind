name: Gmail to Sheets Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Gmail token
        run: |
          echo "${{ secrets.GMAIL_TOKEN }}" | base64 --decode > token_gmail.pickle

      - name: Restore Sheets token
        run: |
          echo "${{ secrets.SHEETS_TOKEN }}" | base64 --decode > token_sheets.pickle

      - name: Write config
        run: |
          echo "SHEET_ID = '${{ secrets.SHEET_ID }}'" > config.py
          echo "SHEET_RANGE = 'Sheet1!A:H'" >> config.py
          echo "OPENROUTER_API_KEY = '${{ secrets.OPENROUTER_API_KEY }}'" >> config.py
          echo "TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}'" >> config.py
          echo "TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}'" >> config.py

      - name: Run sync
        run: python -m src.main